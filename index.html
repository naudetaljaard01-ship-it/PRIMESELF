<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b09"><title>PRIMESELF</title><style>
:root{--bg:#080b09;--panel:#111713;--green:#b7ff35;--muted:#9ca79e;--line:#28352b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7f4;font:16px system-ui,-apple-system,sans-serif;padding-bottom:88px}header{padding:22px 18px 14px;position:sticky;top:0;background:#080b09ed;border-bottom:1px solid var(--line);z-index:2}small,.muted{color:var(--muted)}.brand{font-weight:900;letter-spacing:2px;font-size:24px}.brand span{color:var(--green)}main{padding:18px;max-width:700px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.hero{background:linear-gradient(145deg,#172214,#101512);border-color:#4b7024}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:1.5px}h1{font-size:30px;line-height:1.12;margin:10px 0}h2{font-size:19px;margin:0 0 12px}p{line-height:1.5}.btn{background:var(--green);color:#11170a;border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:15px;cursor:pointer}.btn.secondary{background:#1c271c;color:#e8f5e3;border:1px solid #3a5038}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0d120f;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:4}.tabs button{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 1px;display:flex;flex-direction:column;align-items:center;gap:4px}.tabs button b{font-size:20px}.tabs button.active{color:var(--green)}.tabs button.capture{color:var(--green)}.item{display:flex;gap:10px;align-items:flex-start;margin:13px 0}.tick{accent-color:var(--green);width:18px;height:18px;margin-top:3px}.pill{display:inline-block;border:1px solid #4c6b34;border-radius:99px;padding:5px 9px;color:var(--green);font-size:12px}.bar{height:8px;background:#29332a;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;width:8%;background:var(--green)}input,select{background:#0b100c;color:white;border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;margin:7px 0}img#preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:10px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:25px;font-weight:850;color:var(--green)}.foot{font-size:12px;color:var(--muted)}label{display:block}
</style></head><body>
<header><div class="brand">PRIME<span>SELF</span></div><small>Build yourself. Be yourself.</small></header>
<main id="app"></main>
<nav class="tabs" aria-label="Main navigation"><button class="active" data-tab="home"><b>⌂</b>Home</button><button data-tab="fit"><b>◈</b>Prime Fit</button><button data-tab="capture" class="capture"><b>⊕</b>Photo</button><button data-tab="routine"><b>✓</b>Routine</button><button data-tab="rank"><b>🏆</b>Ranking</button></nav>
<script>
const app=document.getElementById('app');let tab='home';let xp=Number(localStorage.getItem('ps-xp')||0);let checks=JSON.parse(localStorage.getItem('ps-checks')||'{}');let history=JSON.parse(localStorage.getItem('ps-history')||'[]');const ranks=[['Rookie',0],['Bronze',100],['Silver',500],['Gold',1200],['Platinum',2500],['Diamond',5000],['Elite',9000],['Master',15000],['Legend',30000],['Malin',50000]];
function currentRank(){let r=ranks[0];for(const x of ranks)if(xp>=x[1])r=x;return r}
function go(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function saveChecks(){localStorage.setItem('ps-checks',JSON.stringify(checks));render()}
function render(){let r=currentRank(),next=ranks.find(x=>x[1]>xp);let progress=next?Math.min(100,Math.round((xp-r[1])/(next[1]-r[1])*100)):100;
if(tab==='home')app.innerHTML=`<section class="panel hero"><div class="eyebrow">YOUR PERSONAL UPGRADE</div><h1>Small habits.<br>Stronger you.</h1><p class="muted">Build confidence through healthy routines, personal style and steady progress.</p><span class="pill">${r[0]} · ${xp} XP</span></section><div class="grid"><section class="panel"><small>YOUR RANK</small><div class="metric">${r[0]}</div><small>Keep showing up</small></section><section class="panel"><small>ROUTINE TODAY</small><div class="metric">${Object.values(checks).filter(Boolean).length}/4</div><small>Daily habits</small></section></div><section class="panel"><h2>Today's focus</h2><p>☀️ Gentle skincare · 💧 Water · 🏃 Move your body · 👕 Wear what feels like you</p><button class="btn" onclick="go('routine')">Open my routine →</button></section><section class="panel"><h2>Weekly progress</h2><p class="muted">Take a photo in similar lighting once a week to track changes for yourself. Photos stay on your device in this prototype.</p><button class="btn secondary" onclick="go('capture')">Add weekly photo</button></section>`;
if(tab==='fit')app.innerHTML=`<div class="eyebrow">PRIME FIT</div><h1>Find your fit.</h1><section class="panel"><h2>What are you dressing for?</h2><select id="occasion"><option>Everyday casual</option><option>School / smart casual</option><option>Sporty</option><option>Going out</option><option>Special occasion</option></select><select id="weather"><option>Warm weather</option><option>Cool weather</option><option>Rainy weather</option></select><button class="btn" onclick="outfit()">Build an outfit</button></section><section class="panel" id="outfitResult"><p class="muted">Choose an occasion to get a mix-and-match idea.</p></section><section class="panel"><h2>Style rule</h2><p>Start with comfort and fit, then combine one statement item with simple basics. You don't need to buy new clothes to look put-together.</p></section>`;
if(tab==='capture')app.innerHTML=`<div class="eyebrow">WEEKLY CHECK-IN</div><h1>Your progress, your pace.</h1><section class="panel"><p class="muted">Use a photo only if you're comfortable. This demo previews it on your device; it does not rate your appearance or send images to an AI service.</p><label class="btn secondary" for="photo">Choose / take a photo</label><input id="photo" type="file" accept="image/*" capture="user"><img id="preview" class="hidden" alt="Selected photo preview"><button class="btn" onclick="savePhoto()">Save check-in date</button><p id="photoMsg" class="muted"></p></section><section class="panel"><h2>Past check-ins</h2>${history.length?history.map(d=>'<p>📅 '+d+'</p>').join(''):'<p class="muted">Your saved check-in dates will appear here.</p>'}</section>`;
if(tab==='routine'){let tasks=['Drink water and eat regular balanced meals','Gentle face wash and moisturiser','Use sunscreen when outdoors','Move or practise a sport you enjoy'];app.innerHTML=`<div class="eyebrow">DAILY ROUTINE</div><h1>Build your basics.</h1><section class="panel"><h2>Morning checklist</h2>${tasks.map((x,i)=>`<label class="item"><input class="tick" type="checkbox" ${checks[i]?'checked':''} onchange="checks[${i}]=this.checked;localStorage.setItem('ps-checks',JSON.stringify(checks));render()"><span>${x}</span></label>`).join('')}<p class="muted">Choose gentle products suited to your skin. Avoid putting ice directly on your face; a cool compress is gentler. If you have persistent skin concerns, ask a healthcare professional.</p><button class="btn secondary" onclick="if(confirm('Reset today’s checklist?')){checks={};localStorage.setItem('ps-checks','{}');render()}">Reset checklist</button></section>`;
if(tab==='rank')app.innerHTML=`<div class="eyebrow">THE RANKING LADDER</div><h1>Keep earning your XP.</h1><section class="panel"><small>CURRENT RANK</small><div class="metric">${r[0]}</div><p>${xp} XP ${next?'· '+(next[1]-xp)+' XP to '+next[0]:'· Top rank reached!'}</p><div class="bar"><span style="width:${progress}%"></span></div><p class="foot">${progress}% towards next rank</p><button class="btn secondary" onclick="addXP()">Demo: add 5 XP</button></section><section class="panel"><h2>All ranks</h2>${ranks.map(x=>`<div class="item"><span>${xp>=x[1]?'🟢':'⚪'}</span><div><strong>${x[0]}</strong><div class="foot">${x[1].toLocaleString()} XP</div></div></div>`).join('')}</section><p class="foot">Demo XP is stored on this device. Real accounts, weekly rewards and paid subscriptions are not connected.</p>`;
}
function addXP(){xp+=5;localStorage.setItem('ps-xp',xp);render()}
function outfit(){const o=document.getElementById('occasion').value,w=document.getElementById('weather').value;const base=o.includes('Sporty')?'Sporty trainers, comfortable joggers and a breathable tee':o.includes('School')?'Clean sneakers, straight-leg trousers and a plain polo or shirt':o.includes('Going out')?'Your favourite clean sneakers, relaxed trousers and a layered top':o.includes('Special')?'A neat outfit in two coordinated colours with comfortable shoes':'A plain tee, relaxed jeans or cargos and clean sneakers';document.getElementById('outfitResult').innerHTML='<h2>Your outfit idea</h2><p>'+base+'.</p><p>'+(w==='Cool weather'?'Add a hoodie or light jacket.':w==='Rainy weather'?'Add a water-resistant jacket and shoes with grip.':'Choose breathable layers and carry a light overshirt if needed.')+'</p><p class="muted">Try pieces you already own first.</p>'}
document.addEventListener('change',e=>{if(e.target.id==='photo'&&e.target.files[0]){const im=document.getElementById('preview');im.src=URL.createObjectURL(e.target.files[0]);im.classList.remove('hidden');document.getElementById('photoMsg').textContent='Preview ready. Tap Save check-in date to record today.'}});
function savePhoto(){const d=new Date().toLocaleDateString();history.unshift(d);history=history.slice(0,12);localStorage.setItem('ps-history',JSON.stringify(history));const m=document.getElementById('photoMsg');if(m)m.textContent='Check-in date saved on this device.';render()}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));render();
</script></body></html>
