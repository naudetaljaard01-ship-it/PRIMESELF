<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b09"><title>PRIMESELF</title>
<style>
:root{color-scheme:dark;--bg:#080b09;--panel:#111713;--green:#b7ff35;--muted:#a3ada5;--line:#2a382c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7f4;font:16px system-ui,sans-serif;padding-bottom:85px}
header{padding:20px 18px 14px;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:900;letter-spacing:2px}.brand span{color:var(--green)}small,.muted{color:var(--muted)}
main{max-width:700px;margin:auto;padding:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.hero{background:linear-gradient(145deg,#172214,#101512);border-color:#4b7024}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--green)}h1{font-size:30px;line-height:1.15;margin:10px 0}h2{font-size:19px;margin:0 0 12px}p{line-height:1.5}.btn{background:var(--green);color:#11170a;border:0;border-radius:11px;padding:12px 15px;font-size:15px;font-weight:800}.secondary{background:#1c271c;color:#f5f7f4;border:1px solid #3a5038}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:24px;color:var(--green);font-weight:850}.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0d120f;border-top:1px solid var(--line);padding:7px 2px calc(7px + env(safe-area-inset-bottom))}.tabs button{background:none;border:0;color:var(--muted);font-size:11px;padding:5px 0}.tabs button span{display:block;font-size:20px}.tabs button.active{color:var(--green)}label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:7px;padding:11px;background:#0b100c;color:white;border:1px solid var(--line);border-radius:9px}img{max-width:100%;max-height:280px;object-fit:contain}.pill{color:var(--green);border:1px solid #4c6b34;border-radius:99px;padding:5px 9px;font-size:12px}
</style>
</head><body>
<header><div class="brand">PRIME<span>SELF</span></div><small>Build yourself. Be yourself.</small></header>
<main id="app"><section class="panel"><h1>PRIMESELF</h1><p>Loading your personal upgrade...</p></section></main>
<nav class="tabs" aria-label="Main navigation">
<button class="active" data-tab="home"><span>⌂</span>Home</button><button data-tab="fit"><span>◈</span>Prime Fit</button><button data-tab="photo"><span>⊕</span>Photo</button><button data-tab="routine"><span>✓</span>Routine</button><button data-tab="rank"><span>🏆</span>Ranking</button>
</nav>
<script>
(function(){
const app=document.getElementById('app');
let tab='home', xp=Number(localStorage.getItem('ps-xp')||0);
let checks={}; try{checks=JSON.parse(localStorage.getItem('ps-checks')||'{}')}catch(e){}
let history=[];try{history=JSON.parse(localStorage.getItem('ps-history')||'[]')}catch(e){}
const ranks=[['Rookie',0],['Bronze',100],['Silver',500],['Gold',1200],['Platinum',2500],['Diamond',5000],['Elite',9000],['Master',15000],['Legend',30000],['Malin',50000]];
function rank(){let current=ranks[0];ranks.forEach(x=>{if(xp>=x[1])current=x});return current}
function go(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function render(){
const current=rank(), next=ranks.find(x=>x[1]>xp);
if(tab==='home'){
app.innerHTML='<section class="panel hero"><div class="eyebrow">YOUR PERSONAL UPGRADE</div><h1>Small habits.<br>Stronger you.</h1><p class="muted">Build confidence through healthy routines, personal style and steady progress.</p><span class="pill">'+current[0]+' · '+xp+' XP</span></section><div class="grid"><section class="panel"><small>YOUR RANK</small><div class="metric">'+current[0]+'</div><small>Keep showing up</small></section><section class="panel"><small>ROUTINE TODAY</small><div class="metric">'+Object.values(checks).filter(Boolean).length+'/4</div><small>Daily habits</small></section></div><section class="panel"><h2>Today’s focus</h2><p>☀️ Gentle skincare · 💧 Water · 🏃 Move your body · 👕 Wear what feels like you</p><button class="btn" id="openRoutine">Open my routine →</button></section><section class="panel"><h2>Weekly progress</h2><p class="muted">Take a photo once a week if you want to track changes for yourself.</p><button class="btn secondary" id="openPhoto">Add weekly photo</button></section>';
document.getElementById('openRoutine').onclick=()=>go('routine');document.getElementById('openPhoto').onclick=()=>go('photo');
}else if(tab==='fit'){
app.innerHTML='<div class="eyebrow">PRIME FIT</div><h1>Find your fit.</h1><section class="panel"><h2>What are you dressing for?</h2><select id="occasion"><option>Everyday casual</option><option>School / smart casual</option><option>Sporty</option><option>Going out</option><option>Special occasion</option></select><select id="weather"><option>Warm weather</option><option>Cool weather</option><option>Rainy weather</option></select><button class="btn" id="buildOutfit">Build an outfit</button></section><section class="panel" id="outfitResult"><p class="muted">Choose an occasion to get an outfit idea.</p></section><section class="panel"><p>Try pieces you already own first. Comfort and confidence matter most.</p></section>';
document.getElementById('buildOutfit').onclick=()=>{const o=document.getElementById('occasion').value,w=document.getElementById('weather').value;let base='A plain tee, relaxed jeans or cargos and clean sneakers';if(o.includes('Sporty'))base='Sporty trainers, comfortable joggers and a breathable tee';else if(o.includes('School'))base='Clean sneakers, straight-leg trousers and a plain polo or shirt';else if(o.includes('Going out'))base='Clean sneakers, relaxed trousers and a layered top';else if(o.includes('Special'))base='A neat outfit in two coordinated colours with comfortable shoes';document.getElementById('outfitResult').innerHTML='<h2>Your outfit idea</h2><p>'+base+'.</p><p>'+(w==='Cool weather'?'Add a hoodie or light jacket.':w==='Rainy weather'?'Add a water-resistant jacket.':'Choose breathable layers.')+'</p>'};
}else if(tab==='photo'){
app.innerHTML='<div class="eyebrow">WEEKLY CHECK-IN</div><h1>Your progress, your pace.</h1><section class="panel"><p class="muted">This demo previews a photo on your device. It does not rate your appearance or send the photo to an AI service.</p><label class="btn secondary" for="photoInput">Choose / take a photo</label><input id="photoInput" type="file" accept="image/*" capture="user"><img id="preview" hidden alt="Photo preview"><button class="btn" id="saveDate">Save check-in date</button><p id="photoMsg" class="muted"></p></section><section class="panel"><h2>Past check-ins</h2>'+(history.length?history.map(d=>'<p>📅 '+d+'</p>').join(''):'<p class="muted">Saved dates will appear here.</p>')+'</section>';
document.getElementById('photoInput').onchange=e=>{if(e.target.files&&e.target.files[0]){const im=document.getElementById('preview');im.src=URL.createObjectURL(e.target.files[0]);im.hidden=false;document.getElementById('photoMsg').textContent='Photo preview ready.'}};
document.getElementById('saveDate').onclick=()=>{history.unshift(new Date().toLocaleDateString());history=history.slice(0,12);localStorage.setItem('ps-history',JSON.stringify(history));render()};
}else if(tab==='routine'){
const tasks=['Drink water and eat regular balanced meals','Use a gentle face wash and moisturiser','Use sunscreen when outdoors','Move or practise a sport you enjoy'];
app.innerHTML='<div class="eyebrow">DAILY ROUTINE</div><h1>Build your basics.</h1><section class="panel"><h2>Morning checklist</h2>'+tasks.map((task,i)=>'<label><input type="checkbox" data-check="'+i+'" '+(checks[i]?'checked':'')+'>'+task+'</label>').join('')+'<p class="muted">Choose gentle products suited to your skin. Avoid putting ice directly on your face; a cool compress is gentler.</p><button class="btn secondary" id="resetChecks">Reset checklist</button></section>';
document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{checks[el.dataset.check]=el.checked;localStorage.setItem('ps-checks',JSON.stringify(checks));render()});document.getElementById('resetChecks').onclick=()=>{checks={};localStorage.setItem('ps-checks','{}');render()};
}else if(tab==='rank'){
const pct=next?Math.min(100,Math.round((xp-current[1])/(next[1]-current[1])*100)):100;
app.innerHTML='<div class="eyebrow">THE RANKING LADDER</div><h1>Keep earning your XP.</h1><section class="panel"><small>CURRENT RANK</small><div class="metric">'+current[0]+'</div><p>'+xp+' XP '+(next?'· '+(next[1]-xp)+' XP to '+next[0]:'· Top rank reached!')+'</p><div style="height:8px;background:#29332a;border-radius:9px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--green)"></div></div><p class="muted">'+pct+'% towards next rank</p><button class="btn secondary" id="demoXP">Demo: add 5 XP</button></section><section class="panel"><h2>All ranks</h2>'+ranks.map(x=>'<p>'+(xp>=x[1]?'🟢':'⚪')+' <strong>'+x[0]+'</strong> — '+x[1].toLocaleString()+' XP</p>').join('')+'</section><p class="muted">Demo XP is stored on this device. Accounts and subscriptions are not connected.</p>';
document.getElementById('demoXP').onclick=()=>{xp+=5;localStorage.setItem('ps-xp',String(xp));render()};
}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
render();
})();
</script></body></html>
