<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b09"><meta name="description" content="Build yourself. Be yourself. Routines, personal style and progress tracking."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>PRIMESELF</title>
<style>
:root{color-scheme:dark;--bg:#080b09;--panel:#101511;--panel2:#151c16;--green:#b7ff35;--muted:#9ba69d;--line:#273329;--soft:#1b241c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#f3f6f2;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px;-webkit-font-smoothing:antialiased}
header{padding:17px 18px 13px;border-bottom:1px solid var(--line);background:#080b09ed;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.brand{font-size:23px;font-weight:850;letter-spacing:1.8px}.brand span{color:var(--green)}
small,.muted{color:var(--muted)}
main{max-width:680px;margin:auto;padding:15px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0}
.hero{background:linear-gradient(135deg,#172219 0%,#101511 75%);border-color:#354b2e}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.7px;color:var(--green);text-transform:uppercase}
h1{font-size:29px;letter-spacing:-.8px;line-height:1.13;margin:8px 0 10px}h2{font-size:17px;letter-spacing:-.2px;margin:0 0 10px}p{line-height:1.55;margin:8px 0 12px}
.btn{background:var(--green);color:#10150b;border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:750;min-height:42px}
.secondary{background:var(--soft);color:#f3f6f2;border:1px solid #344236}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .panel{margin:0}
.metric{font-size:23px;color:var(--green);font-weight:800;letter-spacing:-.5px;margin:3px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#0c110ded;border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(16px)}
.tabs button{background:none;border:0;color:var(--muted);font-size:10px;font-weight:650;padding:5px 0;min-height:49px}
.tabs button span{display:block;font-size:19px;line-height:1.4;margin-bottom:1px}.tabs button.active{color:var(--green)}
label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:7px;padding:11px;background:#0b100c;color:white;border:1px solid var(--line);border-radius:9px;font:inherit}
img{max-width:100%;max-height:280px;object-fit:contain;border-radius:12px}.pill{display:inline-block;color:var(--green);border:1px solid #456137;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700}
button,a,input,select{touch-action:manipulation}button{cursor:pointer;transition:filter .15s ease,transform .15s ease}button:active{transform:scale(.985)}button:hover{filter:brightness(1.06)}
input[type=checkbox]{display:inline-block;width:19px;height:19px;vertical-align:middle;margin:0 10px 0 0;accent-color:var(--green);flex:0 0 auto}
label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px;line-height:1.4;padding:5px 0}
::selection{background:var(--green);color:#080b09}
@media(min-width:600px){main{padding:22px}header{padding-left:max(22px,calc((100% - 636px)/2));padding-right:max(22px,calc((100% - 636px)/2))}.panel{padding:18px}h1{font-size:34px}}

</style>
</head><body>
<header><div class="brand">PRIME<span>SELF</span></div><small>Build yourself. Be yourself.</small></header>
<main id="app"><section class="panel"><h1>PRIMESELF</h1><p>Loading your personal upgrade...</p></section></main>
<nav class="tabs" aria-label="Main navigation">
<button class="active" data-tab="home"><span>⌂</span>Home</button><button data-tab="fit"><span>◈</span>Prime Fit</button><button data-tab="photo"><span>⊕</span>Photo</button><button data-tab="routine"><span>✓</span>Routine</button><button data-tab="rank"><span>🏆</span>Ranking</button>
</nav>
<script>
(function(){
const app=document.getElementById('app');
let tab='home', xp=Number(localStorage.getItem('ps-xp')||0);
let prefs={style:'Mixed styles',goal:'Build healthy habits',routine:'Balanced',wardrobe:'Both sources'};try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem('ps-prefs')||'{}'))}catch(e){}
let lastClaim=localStorage.getItem('ps-last-claim')||'';
let checks={}; try{checks=JSON.parse(localStorage.getItem('ps-checks')||'{}')}catch(e){}
let history=[];try{history=JSON.parse(localStorage.getItem('ps-history')||'[]')}catch(e){}
const ranks=[['Rookie',0],['Bronze',100],['Silver',500],['Gold',1200],['Platinum',2500],['Diamond',5000],['Elite',9000],['Master',15000],['Legend',30000],['Malin',50000]];
function rank(){let current=ranks[0];ranks.forEach(x=>{if(xp>=x[1])current=x});return current}
function go(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function render(){
const current=rank(), next=ranks.find(x=>x[1]>xp);
if(tab==='home'){
app.innerHTML='<section class="panel hero"><div class="eyebrow">YOUR PERSONAL UPGRADE</div><h1>Small habits.<br>Stronger you.</h1><p class="muted">Build confidence through healthy routines, personal style and steady progress.</p><span class="pill">'+current[0]+' · '+xp+' XP</span></section><div class="grid"><section class="panel"><small>YOUR RANK</small><div class="metric">'+current[0]+'</div><small>Keep showing up</small></section><section class="panel"><small>ROUTINE TODAY</small><div class="metric">'+Object.values(checks).filter(Boolean).length+'/4</div><small>Daily habits</small></section></div><section class="panel"><h2>Today’s focus</h2><p>☀️ Gentle skincare · 💧 Water · 🏃 Move your body · 👕 Wear what feels like you</p><button class="btn" id="openRoutine">Open my routine →</button></section><section class="panel"><h2>Weekly progress</h2><p class="muted">Take a photo once a week if you want to track changes for yourself.</p><button class="btn secondary" id="openPhoto">Add weekly photo</button></section>';
document.getElementById('openRoutine').onclick=()=>go('routine');document.getElementById('openPhoto').onclick=()=>go('photo');
app.insertAdjacentHTML('beforeend','<section class="panel"><h2>Daily reward</h2><p class="muted">Earn 5 XP for checking in today.</p><button class="btn secondary" id="claimXP">Claim daily 5 XP</button><p id="claimMsg" class="muted"></p></section><section class="panel"><div class="eyebrow">MEMBERSHIP</div><h2>Unlock your full potential</h2><p class="muted">Explore PRIMESELF Premium and Ultra plans.</p><button class="btn" id="openMembership">View membership plans →</button> <button class="btn secondary" id="openSettings">Personalise app ⚙</button></section>');document.getElementById('openMembership').onclick=()=>go('membership');document.getElementById('openSettings').onclick=()=>go('settings');document.getElementById('claimXP').onclick=()=>{const today=new Date().toLocaleDateString();if(lastClaim===today){document.getElementById('claimMsg').textContent='You already claimed today. Come back tomorrow!'}else{xp+=5;lastClaim=today;localStorage.setItem('ps-xp',String(xp));localStorage.setItem('ps-last-claim',lastClaim);document.getElementById('claimMsg').textContent='Great job! 5 XP added. Total: '+xp+' XP.';}};
}else if(tab==='settings'){
app.innerHTML='<div class="eyebrow">YOUR EXPERIENCE</div><h1>Make it yours.</h1><section class="panel"><h2>Preferences</h2><label>Style<select id="prefStyle"><option>Mixed styles</option><option>Streetwear</option><option>Sporty</option><option>Casual</option><option>Smart casual</option><option>Minimal</option></select></label><label>Main goal<select id="prefGoal"><option>Build healthy habits</option><option>Improve personal style</option><option>Build confidence</option><option>Track consistency</option></select></label><label>Routine focus<select id="prefRoutine"><option>Balanced</option><option>Skincare basics</option><option>Haircare basics</option><option>Sports and recovery</option></select></label><label>Outfit sources<select id="prefWardrobe"><option>Both sources</option><option>My clothes</option><option>New outfit ideas</option></select></label><button class="btn" id="savePrefs">Save preferences</button><p id="prefsMsg" class="muted"></p></section><section class="panel"><h2>Privacy</h2><p>Photo previews are local to this demo; no AI service analyses them. Be careful saving private photos on a shared device.</p><button class="btn secondary" id="clearHistory">Clear saved photo dates</button> <button class="btn secondary" id="backHomeSettings">Back Home</button><p id="privacyMsg" class="muted"></p></section>';document.getElementById('prefStyle').value=prefs.style;document.getElementById('prefGoal').value=prefs.goal;document.getElementById('prefRoutine').value=prefs.routine;document.getElementById('prefWardrobe').value=prefs.wardrobe;document.getElementById('savePrefs').onclick=()=>{prefs={style:document.getElementById('prefStyle').value,goal:document.getElementById('prefGoal').value,routine:document.getElementById('prefRoutine').value,wardrobe:document.getElementById('prefWardrobe').value};localStorage.setItem('ps-prefs',JSON.stringify(prefs));document.getElementById('prefsMsg').textContent='Preferences saved on this device.'};document.getElementById('clearHistory').onclick=()=>{history=[];localStorage.removeItem('ps-history');document.getElementById('privacyMsg').textContent='Saved photo dates cleared.'};document.getElementById('backHomeSettings').onclick=()=>go('home');
 }else if(tab==='fit'){
let wardrobe=[];try{wardrobe=JSON.parse(localStorage.getItem('ps-wardrobe')||'[]')}catch(e){}
const types=['T-shirts','Shirts','Hoodies & jackets','Trousers & jeans','Shorts','Sneakers & shoes','Accessories'];
const icons={'T-shirts':'👕','Shirts':'👔','Hoodies & jackets':'🧥','Trousers & jeans':'👖','Shorts':'🩳','Sneakers & shoes':'👟','Accessories':'🧢'};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saveWardrobe=()=>localStorage.setItem('ps-wardrobe',JSON.stringify(wardrobe));
app.innerHTML='<div class="eyebrow">PRIME FIT / PERSONAL STYLE</div><h1>Your style.<br>Your rules.</h1><p class="muted">Create outfits from clothes you own or explore fresh combinations.</p><section class="panel hero"><div class="eyebrow">YOUR STYLE PROFILE</div><h2>'+esc(prefs.style)+'</h2><p class="muted">Outfit sources: '+esc(prefs.wardrobe)+'</p><button class="btn secondary" id="fitSettings">Edit style preferences →</button></section><section class="panel"><h2>01 / My wardrobe</h2><p class="muted">Add clothes you own. Items are saved on this device.</p><label>Clothing type<select id="wardrobeType">'+types.map(x=>'<option>'+x+'</option>').join('')+'</select></label><div class="grid"><label>Colour<input id="wardrobeColour" placeholder="e.g. black"></label><label>Item name<input id="wardrobeName" placeholder="e.g. black hoodie"></label></div><button class="btn" id="addWardrobe">+ Add item</button><div id="wardrobeList" style="margin-top:12px">'+(wardrobe.length?wardrobe.map((it,i)=>'<div class="panel" style="display:flex;align-items:center;gap:10px;padding:10px;margin:7px 0"><span style="font-size:26px">'+(icons[it.type]||'👕')+'</span><div style="flex:1"><strong>'+esc(it.name||it.type)+'</strong><div class="muted">'+esc(it.colour)+' · '+esc(it.type)+'</div></div><button class="btn secondary" data-remove="'+i+'">×</button></div>').join(''):'<p class="muted">No items yet — add a few pieces to build outfits from your own wardrobe.</p>')+'</div></section><section class="panel"><h2>02 / Outfit builder</h2><div class="grid"><label>Occasion<select id="occasion"><option>Everyday casual</option><option>School / smart casual</option><option>Sporty / active</option><option>Going out</option><option>Special occasion</option><option>Relaxed weekend</option></select></label><label>Weather<select id="weather"><option>Warm / sunny</option><option>Cool</option><option>Rainy</option><option>Hot</option></select></label></div><label>Outfit source<select id="outfitSource"><option value="wardrobe">My clothes only</option><option value="mix">Mix my clothes with new ideas</option><option value="ideas">Fresh outfit ideas</option></select></label><label>Style<select id="outfitStyle"><option>Use my saved style</option><option>Streetwear</option><option>Sporty</option><option>Casual</option><option>Smart casual</option><option>Minimal</option><option>Mixed styles</option></select></label><button class="btn" id="buildOutfit">Create my outfit ✦</button></section><section class="panel" id="outfitResult"><div class="eyebrow">OUTFIT PREVIEW</div><h2>Your next fit</h2><p class="muted">Choose your options and create an outfit to see the visual board.</p><div class="grid">'+['👕 TOP','👖 BOTTOMS','👟 SHOES','🧥 LAYER'].map(x=>'<div class="panel" style="text-align:center;margin:0"><div style="font-size:38px">'+x.split(' ')[0]+'</div><small>'+x.split(' ').slice(1).join(' ')+'</small></div>').join('')+'</div></section><section class="panel"><h2>Style notes</h2><p>• Start with two or three colours that work together.</p><p>• Balance layers in a way that feels comfortable to you.</p><p>• Reuse what you own; style does not require buying new clothes.</p><p class="muted">This version makes outfit suggestions on-device. It does not yet provide AI photo try-on or live weather data.</p></section>';
document.getElementById('fitSettings').onclick=()=>go('settings');
document.getElementById('addWardrobe').onclick=()=>{wardrobe.push({type:document.getElementById('wardrobeType').value,colour:document.getElementById('wardrobeColour').value.trim(),name:document.getElementById('wardrobeName').value.trim()});saveWardrobe();render()};
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{wardrobe.splice(Number(b.dataset.remove),1);saveWardrobe();render()});
document.getElementById('buildOutfit').onclick=()=>{
const occasion=document.getElementById('occasion').value,weather=document.getElementById('weather').value,source=document.getElementById('outfitSource').value;
const chosen=document.getElementById('outfitStyle').value,style=chosen==='Use my saved style'?prefs.style:chosen;
const choose=arr=>arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
const tops=wardrobe.filter(x=>['T-shirts','Shirts'].includes(x.type)),bottoms=wardrobe.filter(x=>['Trousers & jeans','Shorts'].includes(x.type)),shoes=wardrobe.filter(x=>x.type==='Sneakers & shoes'),layers=wardrobe.filter(x=>x.type==='Hoodies & jackets'),accs=wardrobe.filter(x=>x.type==='Accessories');
const own=source!=='ideas',t=own?choose(tops):null,b=own?choose(bottoms):null,s=own?choose(shoes):null,l=own&&weather!=='Hot'&&weather!=='Warm / sunny'?choose(layers):null,a=own?choose(accs):null;
const top=t?(t.name||t.type):(occasion.includes('Sporty')?'Breathable sports tee':occasion.includes('School')?'Plain polo or neat shirt':occasion.includes('Special')?'Smart shirt or neat top':'Plain tee or relaxed shirt');
const bottom=b?(b.name||b.type):(occasion.includes('Sporty')?'Training shorts or joggers':occasion.includes('School')||occasion.includes('Special')?'Straight-leg trousers':'Jeans, cargos or comfortable shorts');
const shoe=s?(s.name||s.type):(occasion.includes('Sporty')?'Training sneakers':'Clean everyday sneakers');
const layer=l?(l.name||l.type):(weather==='Rainy'?'Water-resistant jacket':weather==='Cool'?'Hoodie or light jacket':'Optional light layer');
const tip=style==='Streetwear'?'Try relaxed layers, cargos and a simple colour palette.':style==='Sporty'?'Choose breathable pieces and shoes suited to your activity.':style==='Smart casual'?'Keep the top neat and pair it with clean trousers and shoes.':style==='Minimal'?'Keep the look simple with two or three coordinated colours.':style==='Casual'?'Choose easy layers and pieces you can move in.':'Mix one standout piece with simple basics.';
const tile=(emoji,label,name,col)=>'<div class="panel" style="text-align:center;margin:0;padding:12px 5px;background:linear-gradient(160deg,#172019,#0e130f)"><div style="font-size:40px">'+emoji+'</div><div style="font-size:10px;letter-spacing:1px;color:var(--green);font-weight:800">'+label+'</div><div style="font-size:12px;margin-top:5px">'+esc(name)+'</div>'+(col?'<small>'+esc(col)+'</small>':'')+'</div>';
const topIcon=t&&t.type==='Shirts'?'👔':'👕',bottomIcon=b&&b.type==='Shorts'?'🩳':'👖';
document.getElementById('outfitResult').innerHTML='<div class="eyebrow">YOUR OUTFIT PREVIEW</div><h2>'+esc(style)+' · '+esc(occasion)+'</h2><p class="muted">'+esc(weather)+' weather · '+(source==='wardrobe'?'Your wardrobe':source==='mix'?'Wardrobe + new ideas':'Fresh outfit idea')+'</p><div class="grid">'+tile(topIcon,'TOP',top,t&&t.colour)+tile(bottomIcon,'BOTTOMS',bottom,b&&b.colour)+tile('👟','SHOES',shoe,s&&s.colour)+tile(weather==='Rainy'?'🌧️':'🧥','LAYER',layer,l&&l.colour)+'</div>'+(a?'<p>Accessory: <strong>'+esc(a.name||a.type)+'</strong>.</p>':'')+'<h2 style="margin-top:16px">Why it works</h2><p>'+esc(tip)+'</p><p class="muted">Adjust the combination to suit your comfort and personal taste.</p>'+(source==='wardrobe'&&!wardrobe.length?'<p class="muted">Add items above to get wardrobe-based outfit suggestions.</p>':'');
};
}else if(tab==='photo'){
app.innerHTML='<div class="eyebrow">WEEKLY CHECK-IN</div><h1>Your progress, your pace.</h1><section class="panel"><p class="muted">This demo previews a photo on your device. It does not rate your appearance or send the photo to an AI service.</p><label class="btn secondary" for="photoInput">Choose / take a photo</label><input id="photoInput" type="file" accept="image/*" capture="user"><img id="preview" hidden alt="Photo preview"><button class="btn" id="saveDate">Save check-in date</button><p id="photoMsg" class="muted"></p></section><section class="panel"><h2>Past check-ins</h2>'+(history.length?history.map(d=>'<p>📅 '+d+'</p>').join(''):'<p class="muted">Saved dates will appear here.</p>')+'</section>';
document.getElementById('photoInput').onchange=e=>{if(e.target.files&&e.target.files[0]){const im=document.getElementById('preview');im.src=URL.createObjectURL(e.target.files[0]);im.hidden=false;document.getElementById('photoMsg').textContent='Photo preview ready.'}};
document.getElementById('saveDate').onclick=()=>{history.unshift(new Date().toLocaleDateString());history=history.slice(0,12);localStorage.setItem('ps-history',JSON.stringify(history));render()};
}else if(tab==='routine'){
const tasks=prefs.routine==='Skincare basics'?['Use a gentle face wash','Apply a moisturiser that suits your skin','Use sunscreen outdoors','Avoid harsh scrubs']:prefs.routine==='Haircare basics'?['Use a gentle shampoo when needed','Condition hair if suitable','Avoid excessive heat styling','Brush gently']:prefs.routine==='Sports and recovery'?['Warm up before activity','Drink water and eat regular balanced meals','Practise a sport you enjoy','Allow time for rest and sleep']:['Drink water and eat regular balanced meals','Use a gentle face wash and moisturiser','Use sunscreen when outdoors','Move or practise a sport you enjoy'];
const evening=['Gently cleanse your face if needed','Moisturise if your skin needs it','Prepare clothes or gear for tomorrow','Wind down and aim for enough sleep'];
app.innerHTML='<div class="eyebrow">DAILY ROUTINE</div><h1>Build your basics.</h1><section class="panel"><h2>☀️ Morning checklist</h2>'+tasks.map((task,i)=>'<label><input type="checkbox" data-check="'+i+'" '+(checks['m'+i]?'checked':'')+'>'+task+'</label>').join('')+'</section><section class="panel"><h2>🌙 Evening checklist</h2>'+evening.map((task,i)=>'<label><input type="checkbox" data-evening="'+i+'" '+(checks['e'+i]?'checked':'')+'>'+task+'</label>').join('')+'<p class="muted">Keep routines gentle and age-appropriate. Avoid putting ice directly on your face; a cool compress is gentler.</p><button class="btn secondary" id="resetChecks">Reset today’s checklist</button></section><section class="panel"><h2>Routine progress</h2><div class="metric">'+Object.values(checks).filter(Boolean).length+'/8</div><p class="muted">Aim for consistency, not perfection.</p></section>';
document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{checks['m'+el.dataset.check]=el.checked;localStorage.setItem('ps-checks',JSON.stringify(checks));render()});document.querySelectorAll('[data-evening]').forEach(el=>el.onchange=()=>{checks['e'+el.dataset.evening]=el.checked;localStorage.setItem('ps-checks',JSON.stringify(checks));render()});document.getElementById('resetChecks').onclick=()=>{checks={};localStorage.setItem('ps-checks','{}');render()};
}else if(tab==='membership'){
app.innerHTML='<div class="eyebrow">PRIMESELF MEMBERSHIP</div><h1>Choose your plan.</h1><p class="muted">Planned prices shown in USD. Payments are not active in this prototype.</p><section class="panel"><div class="eyebrow">ESSENTIALS</div><h2>PRIMESELF Premium</h2><div class="metric">$2.00 <small>/ month</small></div><p>Core routines, progress tracking and PRIME FIT ideas.</p><button class="btn secondary" id="premiumInfo">Choose Premium</button><p class="muted" id="premiumMsg"></p></section><section class="panel hero"><div class="eyebrow">ADVANCED</div><h2>PRIMESELF Ultra</h2><div class="metric">$3.50 <small>/ month</small></div><p><strong>3-day free trial</strong>, then $3.50/month if you continue.</p><p>Planned access to advanced tools and extra personalisation.</p><button class="btn" id="ultraInfo">Start 3-day free trial</button><p class="muted" id="ultraMsg"></p></section><section class="panel"><h2>Billing information</h2><p>There is no payment processing connected yet, so these buttons do not start a subscription or charge you.</p><p>When billing is added, the checkout will clearly show the trial end date and recurring price. Cancel during the free trial to stop future billing without a cancellation fee.</p><button class="btn secondary" id="backHome">← Back to Home</button></section>';
document.getElementById('premiumInfo').onclick=()=>document.getElementById('premiumMsg').textContent='Premium is planned at $2.00/month. Checkout is not connected yet.';
document.getElementById('ultraInfo').onclick=()=>document.getElementById('ultraMsg').textContent='Ultra is planned with a 3-day free trial, then $3.50/month. No trial or payment has started.';
document.getElementById('backHome').onclick=()=>go('home');
}else if(tab==='rank'){
const pct=next?Math.min(100,Math.round((xp-current[1])/(next[1]-current[1])*100)):100;
app.innerHTML='<div class="eyebrow">THE RANKING LADDER</div><h1>Keep earning your XP.</h1><section class="panel"><small>CURRENT RANK</small><div class="metric">'+current[0]+'</div><p>'+xp+' XP '+(next?'· '+(next[1]-xp)+' XP to '+next[0]:'· Top rank reached!')+'</p><div style="height:8px;background:#29332a;border-radius:9px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--green)"></div></div><p class="muted">'+pct+'% towards next rank</p><button class="btn secondary" id="demoXP">Demo: add 5 XP</button></section><section class="panel"><h2>All ranks</h2>'+ranks.map(x=>'<p>'+(xp>=x[1]?'🟢':'⚪')+' <strong>'+x[0]+'</strong> — '+x[1].toLocaleString()+' XP</p>').join('')+'</section><section class="panel"><h2>Achievements</h2><p>'+(xp>=5?'🏅 First steps — earned XP':'🔒 First steps — earn your first XP')+'</p><p>'+(Object.values(checks).filter(Boolean).length>=4?'✅ Routine complete':'🎯 Routine builder — check all 4 habits')+'</p><p>'+(history.length>0?'📸 First check-in saved':'📷 Progress keeper — save a weekly check-in')+'</p></section><section class="panel"><h2>Weekly challenge</h2><p>Complete your routine consistently this week. Small, healthy habits count.</p></section><p class="muted">XP is stored on this device. Accounts, cloud sync, AI analysis and subscriptions are not connected.</p>';
document.getElementById('demoXP').onclick=()=>{xp+=5;localStorage.setItem('ps-xp',String(xp));render()};
}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
render();
})();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {})); }</script></body></html>
